name: Mobile APK Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g., v1.2.0)'
        required: true
        type: string

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: pnpm install

      - name: Build shared workspace packages
        run: pnpm --filter @mymemory/shared build

      - name: Build Android APK (Production)
        id: build_apk
        working-directory: apps/mobile
        run: eas build --platform android --profile production --local --output=../../app-release.apk

      - name: Upload APK Artifact
        if: ${{ always() && hashFiles('app-release.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ hashFiles('app-release.apk') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          files: ./app-release.apk
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
