name: Backend Deploy

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/server/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get Vercel Project ID
        id: vercel-project
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID_SERVER_PROD }}" >> $GITHUB_OUTPUT
            echo "ENV_FLAG=--prod" >> $GITHUB_OUTPUT
          else
            echo "PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID_SERVER_STAGE }}" >> $GITHUB_OUTPUT
            echo "ENV_FLAG=" >> $GITHUB_OUTPUT
          fi

      - name: Pull Vercel Environment Information
        run: npx vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.vercel-project.outputs.PROJECT_ID }}

      - name: Build Project Artifacts
        run: npx vercel build ${{ steps.vercel-project.outputs.ENV_FLAG }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.vercel-project.outputs.PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        run: npx vercel deploy --prebuilt ${{ steps.vercel-project.outputs.ENV_FLAG }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.vercel-project.outputs.PROJECT_ID }}
