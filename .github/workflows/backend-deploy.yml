name: Backend Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target environment"
        required: true
        type: choice
        options:
          - stage
          - prod

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel (${{ inputs.environment }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Required Secrets
        run: |
          missing=0
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID_SERVER; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_SERVER: ${{ secrets.VERCEL_PROJECT_ID_SERVER }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Prebuild Workspace Dependencies
        run: pnpm --filter @mymemory/db --filter @mymemory/shared build

      - name: Resolve Vercel Deploy Mode
        id: deploy-mode
        run: |
          if [[ "${{ inputs.environment }}" == "prod" ]]; then
            echo "VERCEL_ENV=production" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_FLAG=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "VERCEL_ENV=preview" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_FLAG=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel Environment Information
        run: npx vercel pull --yes --environment=${{ steps.deploy-mode.outputs.VERCEL_ENV }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SERVER }}

      - name: Build Project Artifacts
        run: npx vercel build ${{ steps.deploy-mode.outputs.DEPLOY_FLAG }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SERVER }}

      - name: Deploy Project Artifacts to Vercel
        run: npx vercel deploy --prebuilt ${{ steps.deploy-mode.outputs.DEPLOY_FLAG }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SERVER }}
